[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengravity-mcp"
version = "1.0.0"
description = "Servidor MCP multi-agente con Groq y OpenRouter para automatización industrial."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Emmanuel", email = "opengravity@example.com" },
]
keywords = ["mcp", "multi-agent", "groq", "openrouter", "automation", "plc", "scada"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
opengravity = "opengravity.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opengravity"]
